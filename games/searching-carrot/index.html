<!doctype html>
<html>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    .wrapper {
      position: relative;
      display: inline-block;
    }

    #loading {
      position: absolute;
      top: 50%;
      width: 100%;
      text-align: center;
      font-size: 40px;
      color: #aaa;
      z-index: 1;
      transform: translateY(-50%);
    }

    canvas {
      display: none;
      background: #e8f5e9;
    }
  </style>
  <div class="wrapper">
    <div id="loading">Loading...</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
  </div>
  <audio id="runAudio" src="https://jskidz.au/audio/run.wav"></audio>
  <audio id="eatAudio" src="https://jskidz.au/audio/take-eat-grab.wav"></audio>
  <script src="main.js" type="module"></script>
</html>
