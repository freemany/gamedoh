<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contra Sprite Preview</title>
  <style>
    body { background: #1a1a2e; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: monospace; color: #fff; }
    .sprite { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    canvas { image-rendering: pixelated; border: 1px solid #333; }
    h2 { margin: 0; font-size: 13px; color: #aaa; }
  </style>
</head>

const COLORS = {
  r: '#f44336', o: '#ff9800', y: '#ffeb3b', g: '#4caf50',
  b: '#1565c0', l: '#42a5f5', p: '#f4c2a1', e: '#9e9e9e',
  d: '#212121', w: '#ffffff', k: '#111111', s: '#aaaaaa',
  u: '#c8a06e', _: null,
};

const BLOCK = 6; // pixels per sprite pixel — larger = easier to see

function drawSprite(canvas, sprite) {
  const rows = sprite.length;
  const cols = sprite[0].length;
  canvas.width  = cols * BLOCK;
  canvas.height = rows * BLOCK;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sprite.forEach((row, ry) => {
    row.forEach((cell, cx) => {
      const color = COLORS[cell];
      if (!color) return; // transparent
      ctx.fillStyle = color;
      ctx.fillRect(cx * BLOCK, ry * BLOCK, BLOCK, BLOCK);
    });
  });
}

function addSprite(name, sprite) {
  const wrap = document.createElement('div');
  wrap.className = 'sprite';
  const title = document.createElement('h2');
  title.textContent = name;
  const canvas = document.createElement('canvas');
  wrap.appendChild(title);
  wrap.appendChild(canvas);
  document.body.appendChild(wrap);
  drawSprite(canvas, sprite);
}
