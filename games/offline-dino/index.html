<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Run</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #e8e8e8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      canvas {
        display: none;
        background: #87ceeb;
        border: 2px solid #ccc;
        image-rendering: pixelated;
      }
      #loading {
        position: absolute;
        top: 10%;
        width: 100%;
        text-align: center;
        font-size: 60px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <canvas id="gameCanvas" width="800" height="350"></canvas>
    <script type="module" src="main.js"></script>
    <audio id="overAudio" src="https://jskidz.au/audio/game-over.wav"></audio>
    <audio id="winAudio" src="https://jskidz.au/audio/winning-chimes.wav"></audio>
  </body>
</html>
